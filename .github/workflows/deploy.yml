name: $bog_gamengine

permissions: write-all

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - uses: browser-actions/setup-chrome@v1
      id: chrome
      with:
        chrome-version: stable

    - name: Point the probe at Chrome
      run: |
        set -euo pipefail
        test -x "${{ steps.chrome.outputs.chrome-path }}"
        echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

    # CI объявляет, что браузер здесь обязателен: без него пробы падают, а не пропускаются.
    # studio/pair и net/pair в списке нет намеренно — им нужен мастер Базы на 9090, которого на
    # раннере не будет, и их пропуск сошёл бы за успех. Как прогнать руками — в их README.
    # Подписи трёх игр сведены в demo/look: данные лежат словарём по имени демо, и один модуль
    # в списке компилирует все три. Сверка картинки всё равно только местная, в CI от подписи
    # проверяется компиляция.
    # net/stand, net/lobby, demo/shooter/gen, studio/case, brain/act/move, save стоят здесь не ради
    # своих тестов, а ради ТАЙПЧЕКА: модуль проверяется, если он в этом списке или он зависимость
    # чего-то из списка. Шесть имён закрывают пятнадцать модулей из восемнадцати, которые иначе не
    # компилируются в CI вовсе. Цена замерена временем, а не числом тестов: около 14 секунд локально,
    # порядка тридцати на раннере, при прогоне в десять минут. Большое число тестов у studio/case —
    # это повторный прогон движковых по замыканию, а не новая работа.
    - uses: hyoo-ru/mam_build@master2
      env:
        CI: true
      with:
        package: 'bog/gamengine'
        modules: 'demo probe look net/probe net/stand net/lobby demo/jumper/probe demo/look demo/shooter/probe demo/shooter/gen demo/legion/probe studio/probe studio/case brain/act/move save pack'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/gamengine/demo/-'

    - name: URLs
      if: github.ref == 'refs/heads/main'
      run: |
        {
          echo "- https://b-on-g.github.io/gamengine/#!demo=quad"
          echo "- https://b-on-g.github.io/gamengine/#!demo=flat"
          echo "- https://b-on-g.github.io/gamengine/#!demo=room"
          echo "- https://b-on-g.github.io/gamengine/#!demo=jumper"
          echo "- https://b-on-g.github.io/gamengine/#!demo=shooter"
          echo "- https://b-on-g.github.io/gamengine/#!demo=legion"
          echo "- https://b-on-g.github.io/gamengine/#!demo=studio"
        } >> "$GITHUB_STEP_SUMMARY"
