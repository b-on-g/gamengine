name: $bog_gamengine

permissions: write-all

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

    - uses: browser-actions/setup-chrome@v1
      id: chrome
      with:
        chrome-version: stable

    - name: Point the probe at Chrome
      run: |
        set -euo pipefail
        test -x "${{ steps.chrome.outputs.chrome-path }}"
        echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

    # CI объявляет, что браузер здесь обязателен: без него пробы падают, а не пропускаются.
    # studio/pair и net/pair в списке нет намеренно — им нужен мастер Базы на 9090, которого на
    # раннере не будет, и их пропуск сошёл бы за успех. Как прогнать руками — в их README.
    # Подписи трёх игр сведены в demo/look: данные лежат словарём по имени демо, и один модуль
    # в списке компилирует все три. Сверка картинки всё равно только местная, в CI от подписи
    # проверяется компиляция.
    # ПОРЯДОК в списке значит больше, чем кажется: mam_build встаёт на первом падении, поэтому модуль,
    # который может упасть по неизвестной причине, стоит последним — иначе он закроет собой ответы про
    # все, что за ним. net/probe стоял четвёртым, упал на готовности страницы, и pack со подписями в
    # том прогоне не проверялись вовсе. Новое и неуверенное — в конец.
    # Пять имён, стоявших здесь только ради ТАЙПЧЕКА, переехали в шаг ниже: net/lobby,
    # demo/shooter/gen, studio/case, brain/act/move, save. В этом списке они стоили 263 секунды
    # замером по отметкам, потому что `modules:` гонит на каждое имя `npm start` — это `npm update`
    # и `bundleAll` со сборкой всех веб-целей и прогоном тестового замыкания дочерним процессом.
    # Тайпчеком из этого была одна цель из двадцати двух.
    # net/stand ОСТАЁТСЯ здесь, и не ради тайпчека: его страницу `net/stand/-/test.html` открывает
    # проба net/probe, а `test.html` делает только `bundleAll`. Убрали — и net/probe лёг с «нет
    # /bog/gamengine/net/stand/-/test.html». То есть имя в списке работало на два разных дела, и
    # проверка покрытия аудита этого не увидела: она утверждает про то, что оставили, и молчит про
    # то, что убрали. Стоять он должен ДО net/probe, иначе страницы ещё нет к моменту пробы.
    # Проверено грепом по константам страниц во всех пробах: кроме net/stand такой связи нет ни у
    # кого, все прочие пробы открывают `demo/-/index.html`.
    - uses: hyoo-ru/mam_build@master2
      env:
        CI: true
      with:
        package: 'bog/gamengine'
        modules: 'demo probe look net/stand demo/jumper/probe demo/look demo/shooter/probe demo/legion/probe studio/probe pack net/probe'

    # `if: always()` — потому что проверка, зависящая от успеха предыдущего шага, исчезает ровно тогда,
    # когда нужнее всего: в первом прогоне сборка легла на пробе, и вместе с ней пропустились аудит,
    # деплой и ссылки, то есть красная сборка отняла и тайпчек, и его замер. Шаг для этого годится: свои
    # программы компилятора он строит сам и результата сборки не ждёт.
    # ОГОВОРКА к условию: шаг рассчитывает, что `mam_build` успел поставить пакеты. Если сборка когда-то
    # ляжет на самой установке, шаг обязан упасть с названной причиной, а не тихо — за этим первая
    # проверка ниже.
    # Тайпчек пяти модулей без прогона их тестов. `bundleAuditJS` строит свою программу TS, другие
    # бандлы ему не нужны, и `.test.ts` из тайпчека НЕ исключаются — покрытие типов то же, уходит
    # только прогон. Цена линейна по числу имён: своя программа TS на модуль, между модулями она не
    # переиспользуется, замерено 10-20 секунд на модуль независимо от порядка. Поэтому число печатается
    # ПО МОДУЛЮ: кто добавит имя, увидит цену своего имени, а не общую сумму.
    # Шаг утверждает, что покрыл: артефакт удаляется перед прогоном, и каждый модуль обязан написать
    # свой `node.audit.js` со словами Audit passed. Иначе «модуль перестал тайпчекаться» осталось бы
    # зелёным — это подмена пропуска успехом, только уровнем выше.
    # Узловой аудит не видит файлы с тегом `web`. Сегодня их в паке нет, поэтому он строго сильнее
    # веб-аудита, но это факт про пак, а не свойство MAM, и он проверяется поиском ниже, а не
    # комментарием: записанное и не прогоняемое правило не охраняет ничего.
    - name: Typecheck without running tests
      if: always()
      env:
        CI: true
        GIT_HTTP_LOW_SPEED_LIMIT: 1000
        GIT_HTTP_LOW_SPEED_TIME: 30
      run: |
        set -uo pipefail

        if [ ! -d node_modules/mam ]; then
          echo "Пакеты не установлены: сборка легла до npm install, тайпчек прогнать нечем."
          echo "Это не «тайпчек прошёл», это «тайпчек не запускался»."
          exit 1
        fi

        stray=$( find bog/gamengine -path '*/-*' -prune -o -name '*.web*.ts' -print )
        if [ -n "$stray" ]; then
          echo "В паке появились файлы с тегом web, а узловой аудит их не видит:"
          echo "$stray"
          echo "Верните их модули в modules: или добавьте в этот шаг веб-аудит."
          exit 1
        fi

        {
          echo "### Тайпчек без прогона тестов"
          echo ""
          echo "| модуль | сек |"
          echo "| --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"

        total=0
        fail=0

        for mod in \
          net/lobby \
          demo/shooter/gen \
          studio/case \
          brain/act/move \
          save
        do
          art="bog/gamengine/$mod/-/node.audit.js"
          rm -f "$art"
          start=$SECONDS
          echo "::group::$mod"
          code=0
          timeout 300 stdbuf -o0 -e0 node bog/gamengine/.github/audit.js "bog/gamengine/$mod" || code=$?
          echo "::endgroup::"
          if [ "$code" -eq 124 ]; then
            echo "$mod: аудит висел дольше 300 с и снят по таймауту, это отказ, а не задержка"
          fi
          spent=$(( SECONDS - start ))
          total=$(( total + spent ))
          echo "| \`$mod\` | $spent |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "$mod: аудит вышел с кодом $code"
            fail=1
          elif [ ! -s "$art" ]; then
            echo "$mod: аудит не написал $art, значит модуль НЕ проверен"
            fail=1
          elif ! grep -q 'Audit passed' "$art"; then
            echo "$mod: аудит не сказал Audit passed"
            cat "$art"
            fail=1
          fi
        done

        echo "| **всего** | **$total** |" >> "$GITHUB_STEP_SUMMARY"
        exit $fail

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/gamengine/demo/-'

    - name: Числа проб из файлов пака
      if: always()
      run: |
        far=bog/gamengine/demo/legion/probe/-/far.md
        if [ -s "$far" ]; then
          cat "$far"
        else
          echo "$far пуст или не создан: проба не дошла до замера, числа за этот прогон нет."
        fi

    - name: URLs
      if: github.ref == 'refs/heads/main'
      run: |
        {
          echo "- https://b-on-g.github.io/gamengine/#!demo=quad"
          echo "- https://b-on-g.github.io/gamengine/#!demo=flat"
          echo "- https://b-on-g.github.io/gamengine/#!demo=room"
          echo "- https://b-on-g.github.io/gamengine/#!demo=jumper"
          echo "- https://b-on-g.github.io/gamengine/#!demo=shooter"
          echo "- https://b-on-g.github.io/gamengine/#!demo=legion"
          echo "- https://b-on-g.github.io/gamengine/#!demo=studio"
          echo "- https://b-on-g.github.io/gamengine/#!demo=crumb"
          echo "- https://b-on-g.github.io/gamengine/#!demo=crumb_studio"
          echo "- https://b-on-g.github.io/gamengine/#!demo=crumb2"
        } >> "$GITHUB_STEP_SUMMARY"
